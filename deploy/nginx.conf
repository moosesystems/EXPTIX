# ExpTix behind nginx + PHP-FPM. Repository checked out at /opt/exptix.
# Only /opt/exptix/public is served. The app folder stays outside the web root.
server {
    listen 443 ssl http2;
    server_name exptix.example.com;

    ssl_certificate     /etc/letsencrypt/live/exptix.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exptix.example.com/privkey.pem;

    root /opt/exptix/public;
    index index.php;
    client_max_body_size 16m;          # uploads.max_mb is 12 by default

    location = /assets/sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }
    location = /HowTo.html { try_files $uri =404; }

    # Everything else goes to the front controller (app, API, MCP, webhooks, guest portal).
    location / {
        try_files $uri /index.php$is_args$args;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        # fastcgi_param EXPTIX_APP_ROOT /opt/exptix/app;   # only if app/ is not next to public/
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}

server {
    listen 80;
    server_name exptix.example.com;
    return 301 https://$host$request_uri;
}
