# ExpTix on Apache 2.4 with PHP-FPM (or mod_php). Repository checked out at /opt/exptix.
# public/.htaccess handles routing; AllowOverride must permit it.
<VirtualHost *:443>
    ServerName exptix.example.com
    DocumentRoot /opt/exptix/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/exptix.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/exptix.example.com/privkey.pem

    <Directory /opt/exptix/public>
        AllowOverride All
        Require all granted
    </Directory>
    # Never serve the app folder.
    <Directory /opt/exptix/app>
        Require all denied
    </Directory>

    # SetEnv EXPTIX_APP_ROOT /opt/exptix/app   # only if app/ is not next to public/

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost"
    </FilesMatch>
</VirtualHost>

<VirtualHost *:80>
    ServerName exptix.example.com
    Redirect permanent / https://exptix.example.com/
</VirtualHost>
